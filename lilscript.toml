# Candidate search runs to convergence rather than the production slice.
# `production` caps the proposal budget at 384 and then scales it by artifact
# size, so a large module exhausts the beam before it reaches the naming and
# class-shape families. Measured on this port with `lilscript-codec`:
[javascript]
priority = "size-first"
optimization_level = 15
cost_model = "brotli"
assume_pristine_builtins = true
strip_console = true
candidate_search = "always"
candidate_proposal_limit = 1536
terminal_codec_probe_limit = 1536
candidate_byte_budget = 16777216
# The one compiler (lilscript aa2052f0) reports every other family the old
# route listed here as having no effect, so only the ones it reads remain.
compression = [
  "identifier-mangling",
  "property-mangling",
  "string-pooling",
  "string-array-packing",
  "parameterized-function-merging",
]
# 8.16 (measured, this artifact): the beam width picks which basin the terminal
# search lands in, and the curve is not monotone -- 8:+0, 12:+0, 16:-97, 20:-97 against the
# default. It is tuned, not raised, and it drifts with the compiler, so it is
# re-measured rather than trusted. (The five largest ports do not respond to it
# at all: their width is clamped by the candidate limit before the beam binds.)
candidate_beam_width = 16
# A property read has no side effect and may be repeated or dropped: this
# port reads plain data, never a getter it would run twice.
assume_pure_property_reads = true

[mangle]
identifiers = true
properties = true

[bundle]
# The artifact carries js-host.ts inside it rather than importing it.
host_modules = "embed"
