# Compiler-owned delivery; no JavaScript post-minifier or export rewriting.
[policy]
version = 3
[javascript]
priority = "size-first"
# Assumes unpatched platform builtins; disable when consumers replace them.
assume_pristine_builtins = true
# Remove debugLog instrumentation; ordinary print and host console effects remain.
strip_debug = true
compression = ["identifier-mangling", "property-mangling", "string-pooling", "string-array-packing", "parameterized-function-merging"]
# Plain-data reads must not run getters; disable for effectful accessor integrations.
assume_pure_property_reads = true

# Preserved effort setting. 13 favors size; 14/15 allow more expensive marginal searches.
[effort]
level = 15

# Optimize the delivered files for this codec, independently of raw/gzip objectives.
[objective]
codecs = "brotli"
[mangle]
identifiers = true
properties = true

[delivery]
mode = "single"
directory = "."
host_modules = "embed"
select = ["esm"]
entry_names = "jquery.esm.js"
[delivery.entries]
esm = "src/package-esm.lil"
cjs = "src/package-cjs.lil"
browser = "src/package-browser.lil"

[[delivery.also]]
name = "cjs"
format = "cjs"
entries = ["cjs"]
exports = "default"
es_module_marker = "never"
entry_names = "jquery.cjs"

# entry.lil owns jQuery/$ registration and noConflict; publish the same callable.
[[delivery.also]]
name = "browser"
format = "iife"
exports = "default"
global = "jQuery"
global_binding = "property"
entries = ["browser"]
entry_names = "jquery.umd.js"
