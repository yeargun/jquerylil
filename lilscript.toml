# Candidate search runs to convergence rather than the production slice.
# `production` caps the proposal budget at 384 and then scales it by artifact
# size, so a large module exhausts the beam before it reaches the naming and
# class-shape families. Measured on this port with `lilscript-codec`:
[javascript]
priority = "size-first"
optimization_level = 15
cost_model = "brotli"
# `k(){…}` is shorter than `k:function(){…}` and, on this artifact, larger:
# measured -94 Brotli and -404 raw with shorthand off, because the shapes the
# emitter reaches without it repeat better. Neutral on the other ports.
struct_method_shorthand = false
assume_pristine_builtins = true
strip_console = true
# 8.19 (measured, fleet sweep of five reserves): the naming reserve picks the
# basin, not the depth, and the curve is not monotone -- 8(declared):+0, 16:-283, 32:-272, 64:-172
# against the declared 8. Re-measure it after any emitter change.
local_name_reserve = 16
# Ask bindings that take part in a token idiom the artifact repeats for the
# spelling that idiom's commonest occurrence uses, so two scopes writing the
# same idiom write it the same way. Every conversion is scored by the exact
# codec before it is kept, so the pass cannot make the artifact bigger; the
# compiler default is off because four ports is not the fleet (lilscript
# e41d433), and on this port it was measured at -40 Brotli with tests green.
idiom_directed_naming = true
candidate_search = "always"
candidate_proposal_limit = 1536
terminal_codec_probe_limit = 1536
candidate_byte_budget = 16777216
compression = [
  "identifier-mangling",
  "entropy-aware-mangling",
  "quote-style-selection",
  "property-mangling",
  "string-pooling",
  "size-aware-inlining",
  "compact-boolean-literals",
  "standard-grammar-elision",
  "structured-closure-inlining",
  "pure-helper-inlining",
  "dense-string-return-tables",
  "host-alias-spelling",
  "string-array-packing",
  "regex-literals",
  "unused-catch-binding-elision",
  "compact-generator-star",
  "callee-default-arguments",
  "scalar-phi-copies",
  "phi-affinity-coalescing",
  "ir-inlining-variants",
  "ir-closure-factory-variants",
  "ir-phase-ordering-variants",
  "loop-spelling-selection",
  "mutation-spelling-selection",
  "parameterized-function-merging",
  "expression-superoptimization",
  "path-sensitive-propagation",
  "joint-representation-search",
  "array-pipeline-fusion",
  "partial-escape-sinking",
]
# 8.16 (measured, this artifact): the beam width picks which basin the terminal
# search lands in, and the curve is not monotone -- 8:+0, 12:+0, 16:-97, 20:-97 against the
# default. It is tuned, not raised, and it drifts with the compiler, so it is
# re-measured rather than trusted. (The five largest ports do not respond to it
# at all: their width is clamped by the candidate limit before the beam binds.)
candidate_beam_width = 16

[mangle]
identifiers = true
properties = true
exports = false
