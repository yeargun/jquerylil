<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Todos · jquerylil</title>
    <link rel="stylesheet" href="./app.css" />
  </head>
  <body>
    <main class="wrap" id="app">
      <nav class="nav">
        <a href="./index.html">Examples</a>
        <a href="./todos.html" aria-current="page">Todos</a>
        <a href="./tabs.html">Tabs</a>
        <a href="./search.html">Search</a>
        <a href="./cart.html">Cart</a>
        <a href="./accordion.html">Accordion</a>
        <a href="./gallery.html">Gallery</a>
      </nav>
      <h1>Todos</h1>
      <p class="lede">Delegated events, <code>.html</code>, <code>.grep</code>, and <code>.merge</code>.</p>
      <form class="row" id="form">
        <input id="title" placeholder="What needs doing?" autocomplete="off" />
        <button type="submit">Add</button>
      </form>
      <ul class="list" id="list"></ul>
      <div class="stat"><span>Remaining</span><strong id="remaining">0</strong></div>
      <div class="row">
        <button class="ghost" id="complete" type="button">Complete all</button>
        <button class="ghost danger" id="clear" type="button">Clear done</button>
      </div>
    </main>
    <script type="module">
      import { jQuery as $ } from "/dist/jquery.esm.js"
      import { mount } from "./lib/todos.js"
      mount($, $("#app"))
    </script>
  </body>
</html>
